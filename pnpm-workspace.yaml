allowBuilds:
  # watcher nativo de archivos que usa @nestjs/cli en modo watch (reemplazo de chokidar)
  '@parcel/watcher': true
  # telemetría de analytics, no es necesaria para ejecutar el proyecto
  '@scarf/scarf': false
  # requiere compilar binario nativo para encriptar contraseñas
  bcrypt: true
  # resolver nativo que utiliza ESLint
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@nestjs/cli@12.0.5'
  - '@nestjs/config@12.0.1'
  - dotenv@18.0.3
  - fs-extra@11.4.1
  - supertest@7.3.0
